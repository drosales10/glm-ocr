# GLM-OCR — Ollama en GPU (recomendado en esta máquina)
# Confirmado: glm-ocr corre al 100% GPU vía Ollama.
# Alternativa vLLM (más throughput): scripts/start-vllm.ps1 + api_port 8080
#
# Optimizado para papers con fórmulas/integrales (prompt Formula Recognition,
# crops ampliados, umbral más bajo en display/inline_formula, PNG).

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

pipeline:
  maas:
    enabled: false

  ocr_api:
    api_host: localhost
    api_port: 11434
    api_path: /api/generate
    model: glm-ocr:latest
    api_mode: ollama_generate
    request_timeout: 1800

  # Concurrencia baja: evita saturar VRAM de 8 GB
  max_workers: 2

  page_loader:
    max_tokens: 8192
    temperature: 0.0
    top_p: 0.00001
    top_k: 1
    repetition_penalty: 1.1
    # PNG preserva trazos finos de integrales/fracciones mejor que JPEG
    image_format: PNG
    pdf_dpi: 300
    # Critico: sin esto Ollama usa "Text Recognition:" tambien en formulas
    task_prompt_mapping:
      text: "Text Recognition:"
      table: "Table Recognition:"
      formula: "Formula Recognition:"

  result_formatter:
    output_format: both
    enable_merge_formula_numbers: true
    enable_merge_text_blocks: true
    enable_format_bullet_points: true

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    # CUDA acelera el layout; en 8 GB VRAM deja la GPU libre para Ollama
    device: cpu
    batch_size: 1
    threshold: 0.3
    # Detectar mas bloques de formula en paginas densas de math
    threshold_by_class:
      # Umbral mas alto evita micro-detecciones que OCR-ean como "0.85"
      formula: 0.35
      formula_number: 0.25
    # Expandir bbox (sobre todo en altura) para no cortar ∫, sumas, limites
    layout_unclip_ratio:
      - 1.12
      - 1.25
    layout_nms: true
    use_polygon: false
    # Preservar formulas pequenas frente a paragrafos de texto grandes
    layout_merge_bboxes_mode: large
    label_task_mapping:
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number
      table:
        - table
      formula:
        # "formula" = etiqueta real del modelo safetensors actual
        - formula
        - display_formula
        - inline_formula
      skip:
        - chart
        - image
      abandon:
        - header
        - footer
        - number
        - footnote
        - aside_text
        - reference
        - footer_image
        - header_image
