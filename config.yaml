# GLM-OCR — Ollama en GPU (recomendado en esta máquina)
# Confirmado: glm-ocr corre al 100% GPU vía Ollama.
# Alternativa vLLM (más throughput): scripts/start-vllm.ps1 + api_port 8080

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

pipeline:
  maas:
    enabled: false

  ocr_api:
    api_host: localhost
    api_port: 11434
    api_path: /api/generate
    model: glm-ocr:latest
    api_mode: ollama_generate
    request_timeout: 600

  # Concurrencia baja: evita saturar VRAM de 8 GB
  max_workers: 2

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    # CUDA acelera el layout; si hay OOM, cambia a cpu
    device: cuda
    batch_size: 1
    label_task_mapping:
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number
      table:
        - table
      formula:
        - display_formula
        - inline_formula
      skip:
        - chart
        - image
      abandon:
        - header
        - footer
        - number
        - footnote
        - aside_text
        - reference
        - footer_image
        - header_image
