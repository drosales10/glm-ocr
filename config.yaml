# GLM-OCR — Ollama en GPU (equilibrio velocidad / calidad)
# Para papers matemáticos densos: config.math.yaml
# Alternativa throughput: scripts/start-vllm.ps1 + api_port 8080

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

pipeline:
  maas:
    enabled: false

  ocr_api:
    api_host: localhost
    api_port: 11434
    api_path: /api/generate
    model: glm-ocr:latest
    api_mode: ollama_generate
    request_timeout: 600

  # 3 workers: buen throughput en 8 GB sin saturar tanto como 4+
  max_workers: 3

  page_loader:
    # 8192 hacía cada región muy lenta en Ollama (num_predict).
    # 2048 basta para párrafos normales; fórmulas largas suelen caber.
    max_tokens: 2048
    temperature: 0.0
    top_p: 0.00001
    top_k: 1
    repetition_penalty: 1.1
    # JPEG: payload más pequeño y más rápido que PNG hacia Ollama
    image_format: JPEG
    pdf_dpi: 200
    task_prompt_mapping:
      text: "Text Recognition:"
      table: "Table Recognition:"
      formula: "Formula Recognition:"

  result_formatter:
    output_format: both
    enable_merge_formula_numbers: true
    enable_merge_text_blocks: true
    enable_format_bullet_points: true

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    # CPU deja la GPU a Ollama (recomendado con 8 GB)
    device: cpu
    batch_size: 1
    threshold: 0.3
    threshold_by_class:
      formula: 0.35
      formula_number: 0.25
    layout_unclip_ratio:
      - 1.08
      - 1.15
    layout_nms: true
    use_polygon: false
    layout_merge_bboxes_mode: large
    label_task_mapping:
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number
      table:
        - table
      formula:
        - formula
        - display_formula
        - inline_formula
      skip:
        - chart
        - image
      abandon:
        - header
        - footer
        - number
        - footnote
        - aside_text
        - reference
        - footer_image
        - header_image
