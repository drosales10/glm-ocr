# GLM-OCR — Ollama (self-hosted, despliegue local)
# Uso: glmocr parse imagen.png --config config.yaml
#      python -m glmocr.server --config config.yaml

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

pipeline:
  maas:
    enabled: false

  ocr_api:
    api_host: localhost
    api_port: 11434
    api_path: /api/generate
    model: glm-ocr:latest
    api_mode: ollama_generate
    request_timeout: 300

  max_workers: 4

  # Detección de layout local (requerido en modo self-hosted)
  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    device: cpu
    batch_size: 1
    label_task_mapping:
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number
      table:
        - table
      formula:
        - display_formula
        - inline_formula
      skip:
        - chart
        - image
      abandon:
        - header
        - footer
        - number
        - footnote
        - aside_text
        - reference
        - footer_image
        - header_image
